[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Shared dependency versions go here; crates opt in with `dep.workspace = true`.
clap = { version = "4", features = ["derive"] }

# Test-only dependencies used throughout the book.
anyhow = "1"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
# 0.8 matches the book's tests (rand::thread_rng, distributions::Alphanumeric).
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
